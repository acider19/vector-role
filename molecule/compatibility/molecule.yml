---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: compatibility-ubuntu
    image: docker.io/pycontribs/ubuntu:latest
    pre_build_image: true
    command: sleep infinity
provisioner:
  name: ansible
verifier:
  name: ansible
scenario:
  name: compatibility
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
