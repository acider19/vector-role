---
# tasks file for vector-role
- name: Ensure Vector installation directory exists
  ansible.builtin.file:
    path: /opt/vector
    state: directory
    mode: '0755'
- name: Download and unpack Vector archive
  ansible.builtin.unarchive:
    src: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=2
    creates: /opt/vector/bin/vector

- name: Ensure configuration directory exists
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Vector group exists
  ansible.builtin.group:
    name: "{{ vector_group }}"
    system: true

- name: Ensure Vector user exists
  ansible.builtin.user:
    name: "{{ vector_user }}"
    group: "{{ vector_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Ensure Vector data directory exists
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: '0755'

- name: Deploy Vector configuration from template
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    mode: '0644'
  notify: Restart vector

- name: Install systemd unit from archive
  ansible.builtin.copy:
    src: /opt/vector/etc/systemd/vector.service
    dest: /etc/systemd/system/vector.service
    remote_src: true
    mode: '0644'
  notify: Restart vector

- name: Create symlink to vector binary in /usr/bin
  ansible.builtin.file:
    src: /opt/vector/bin/vector
    dest: /usr/bin/vector
    state: link
    force: true

- name: Enable and start Vector service
  ansible.builtin.systemd:
    name: vector
    daemon_reload: true
    enabled: true
    state: started
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - not (ansible_facts['virtualization_type'] == 'docker' and ansible_facts['virtualization_role'] == 'guest')
